<style>
:root{--bg:#f4f5f2;--ink:#6b7570}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111514;--ink:#93a09a}}
:root[data-theme="dark"]{--bg:#111514;--ink:#93a09a}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px}
</style>
</head>
<body>
<div id="msg">در حال بارگذاری…</div>
<script>
// This small page never changes, so the home-screen copy on the phone stays valid.
// It always fetches the latest app (app.html) fresh from the server.
(function load(tries) {
  fetch("app.html?t=" + Date.now(), {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () {
      if (tries > 0) return setTimeout(function () { load(tries - 1); }, 2000);
      var m = document.getElementById("msg");
      m.innerHTML = 'اتصال برقرار نشد. <a href="" onclick="location.reload();return false" style="color:#1f7a3a">دوباره امتحان کنید</a>';
    });
})(2);
// coming back to the app after a while: reload so both the app and the numbers are fresh
var shown = Date.now();
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && Date.now() - shown > 10 * 60 * 1000) location.reload();
});
</script>
</body>
</html>
