<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="گزارش آلتین">
<meta name="robots" content="noindex, nofollow">
<title>گزارش مدیریت</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23115e59'/><path d='M45 125V80M75 125V60M105 125V90M135 125V50' stroke='white' stroke-width='14' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2321;--muted:#6b7570;--line:#e3e6e1;--accent:#115e59;--accent-soft:#e3f0ee;--pos:#0f7a4a;--neg:#b42318;--warn:#a15c07;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111514;--card:#1a201e;--ink:#e8ece9;--muted:#93a09a;--line:#2a322f;--accent:#5eb8ad;--accent-soft:#1e3330;--pos:#4cc58a;--neg:#f2766b;--warn:#e6a54a;--shadow:none}}
:root[data-theme="dark"]{--bg:#111514;--card:#1a201e;--ink:#e8ece9;--muted:#93a09a;--line:#2a322f;--accent:#5eb8ad;--accent-soft:#1e3330;--pos:#4cc58a;--neg:#f2766b;--warn:#e6a54a;--shadow:none}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.6;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px}
header h1{font-size:19px;font-weight:800}
header .upd{color:var(--muted);font-size:12.5px;margin-top:2px}
header .upd b{color:var(--ink);font-weight:600}
.stale{color:var(--warn)!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.big{font-size:24px;font-weight:800;letter-spacing:-.3px}
.unit{font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;color:var(--muted);font-size:12px}
.row .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--accent-soft);border-radius:10px;padding:10px 8px;text-align:center}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:14px;display:block;white-space:nowrap}
.seg{display:flex;background:var(--accent-soft);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:7px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
input.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:6px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.b-ok{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.b-wait{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:13px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:700}
.page{display:none}.page.on{display:block}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
#lock form{width:100%;max-width:340px;text-align:center}
#lock h1{font-size:20px;margin-bottom:4px}
#lock p{color:var(--muted);font-size:13px;margin-bottom:18px}
#lock input{width:100%;font:inherit;font-size:18px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#lock button{width:100%;margin-top:10px;font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff}
#lock .err{color:var(--neg);font-size:13px;min-height:20px;margin-top:8px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin:18px 0 8px}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<div id="lock"><form id="lf">
  <h1>گزارش مدیریت</h1>
  <p>برای دیدن گزارش، رمز را وارد کنید</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="رمز">
  <button type="submit">ورود</button>
  <div class="err" id="err"></div>
</form></div>

<div class="wrap" id="app" hidden>
  <header><h1 id="co"></h1><div class="upd">آخرین به‌روزرسانی: <b id="upd"></b></div></header>

  <section class="page on" id="p-home">
    <div class="card"><h2>مانده صندوق و بانک‌ها</h2><div class="big" id="cashTotal"></div><div id="cashList" style="margin-top:6px"></div></div>
    <div class="card"><h2>فروش</h2><div class="grid3" id="salesK"></div></div>
    <div class="card"><h2>خرید</h2><div class="grid3" id="buyK"></div></div>
    <div class="card"><h2>چک‌های سررسید این هفته</h2><div id="chqSum"></div></div>
  </section>

  <section class="page" id="p-parties">
    <div class="card">
      <div class="seg" id="pSeg"><button class="on" data-f="deb">بدهکاران</button><button data-f="cred">بستانکاران</button></div>
      <input class="search" id="pq" type="search" placeholder="جستجوی نام…">
      <div id="pTotal" style="color:var(--muted);font-size:13px;margin-bottom:4px"></div>
      <div id="pList"></div>
    </div>
  </section>

  <section class="page" id="p-cheques">
    <div class="card"><h2>چک‌های دریافتی تا آخر این هفته</h2><div id="chIn"></div></div>
    <div class="card"><h2>چک‌های پرداختی تا آخر این هفته</h2><div id="chOut"></div></div>
  </section>

  <section class="page" id="p-stock">
    <div class="card"><h2>موجودی کالا</h2><input class="search" id="sq" type="search" placeholder="جستجوی کالا…"><div id="sList"></div></div>
  </section>

  <section class="page" id="p-tax">
    <div class="card"><h2>وضعیت فاکتورهای فروش در سامانه مودیان</h2><div id="tList"></div></div>
  </section>

  <div class="foot">همه‌ی مبالغ به تومان · <a href="#" id="logout">خروج</a></div>
</div>

<nav id="nav" hidden>
  <button class="on" data-p="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>خلاصه</button>
  <button data-p="parties"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>طرف حساب</button>
  <button data-p="cheques"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 14h6M15 10h3"/></svg>چک‌ها</button>
  <button data-p="stock"><svg viewBox="0 0 24 24"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9"/></svg>موجودی</button>
  <button data-p="tax"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg>مودیان</button>
</nav>

<script>
const DATA_URL = "data.enc.json";
const $ = s => document.querySelector(s);
const fa = n => Math.round(n).toLocaleString("fa-IR");
const toman = r => fa(r / 10);
const compact = r => { const t = r / 10, a = Math.abs(t);
  if (a >= 1e9) return (t/1e9).toLocaleString("fa-IR",{maximumFractionDigits:1}) + " میلیارد";
  if (a >= 1e6) return (t/1e6).toLocaleString("fa-IR",{maximumFractionDigits:1}) + " میلیون";
  return fa(t); };
const faD = s => String(s).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pkg, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey","deriveBits"]);
  const kdf = {name:"PBKDF2", salt:b64(pkg.salt), iterations:200000, hash:"SHA-256"};
  if (pkg.v === 2) {
    const bits = new Uint8Array(await crypto.subtle.deriveBits(kdf, base, 512));
    const mk = await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
    const iv = b64(pkg.iv), ct = b64(pkg.data), msg = new Uint8Array(iv.length + ct.length); msg.set(iv); msg.set(ct, iv.length);
    if (!await crypto.subtle.verify("HMAC", mk, b64(pkg.mac), msg)) throw new Error("pw");
    const ek = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC", iv}, ek, ct)));
  }
  const key = await crypto.subtle.deriveKey(kdf, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(pkg.iv)}, key, b64(pkg.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
const normDigits = s => s.trim().replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660);
async function load(pw) {
  let pkg;
  try {
    const r = await fetch(new URL(DATA_URL, location.href).href + "?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw 0;
    pkg = await r.json();
  } catch { throw new Error("net"); }
  return decrypt(pkg, normDigits(pw));
}
function row(name, val, cls = "", sub = "") {
  return `<div class="row"><span class="n">${esc(name)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span><span class="v ${cls}">${val}</span></div>`;
}
function kpis(o) {
  return [["امروز",o.today],["این هفته",o.week],["این ماه",o.month]].map(([l,v]) => `<div class="kpi"><span>${l}</span><b>${compact(v)}</b></div>`).join("");
}
let D, pFilter = "deb";

function render() {
  $("#co").textContent = D.company;
  $("#upd").textContent = faD(D.updated);
  const ageH = D.updated_iso ? (Date.now() - new Date(D.updated_iso)) / 36e5 : 0;
  $("#upd").classList.toggle("stale", ageH > 24);
  const tot = D.cash.reduce((a,c) => a + c.balance, 0);
  $("#cashTotal").innerHTML = `${toman(tot)}<span class="unit">تومان</span>`;
  $("#cashList").innerHTML = D.cash.map(c => row(c.name, toman(c.balance), c.balance < 0 ? "neg" : "")).join("");
  $("#salesK").innerHTML = kpis(D.sales);
  $("#buyK").innerHTML = kpis(D.purchases);
  const si = D.cheques_in.reduce((a,c) => a + c.amount, 0), so = D.cheques_out.reduce((a,c) => a + c.amount, 0);
  $("#chqSum").innerHTML = row(`دریافتی (${fa(D.cheques_in.length)} فقره)`, toman(si), "pos") + row(`پرداختی (${fa(D.cheques_out.length)} فقره)`, toman(so), "neg");
  const chq = (l, cls) => l.length ? l.map(c => row(c.party || "—", toman(c.amount), cls, `${faD(c.date)} · ش ${faD(c.number)}${c.overdue ? " · سررسید گذشته" : ""}`)).join("") : `<div class="empty">چکی برای این هفته نیست</div>`;
  $("#chIn").innerHTML = chq(D.cheques_in, "pos");
  $("#chOut").innerHTML = chq(D.cheques_out, "neg");
  renderParties(); renderStock();
  const TS = {sent:["ارسال شده","b-ok"], unsent:["ارسال نشده","b-wait"], error:["خطا","b-bad"]};
  const ts = s => TS[s] || [s, s.includes("تأیید") ? "b-ok" : s.includes("رد") ? "b-bad" : "b-wait"];
  $("#tList").innerHTML = D.tax_invoices.length ? D.tax_invoices.map(t => `<div class="row"><span class="n">${esc(t.party)}<span class="sub">فاکتور ${fa(t.no)} · ${faD(esc(t.date))} · ${toman(t.amount)} تومان</span></span><span class="badge ${ts(t.status)[1]}">${esc(ts(t.status)[0])}</span></div>`).join("") : `<div class="empty">فاکتوری ثبت نشده</div>`;
}
function renderParties() {
  const q = $("#pq").value.trim();
  const l = D.parties.filter(p => (pFilter === "deb" ? p.balance > 0 : p.balance < 0) && (!q || p.name.includes(q))).sort((a,b) => Math.abs(b.balance) - Math.abs(a.balance));
  const sum = l.reduce((a,p) => a + Math.abs(p.balance), 0);
  $("#pTotal").textContent = `${fa(l.length)} نفر · جمع ${toman(sum)} تومان`;
  $("#pList").innerHTML = l.length ? l.map(p => row(p.name, toman(Math.abs(p.balance)), pFilter === "deb" ? "pos" : "neg")).join("") : `<div class="empty">موردی نیست</div>`;
}
function renderStock() {
  const q = $("#sq").value.trim();
  const l = D.stock.filter(s => !q || s.name.includes(q));
  $("#sList").innerHTML = l.length ? l.map(s => row(s.name, `${fa(s.qty)} <span class="unit">${esc(s.unit)}</span>`, s.qty <= 0 ? "neg" : "")).join("") : `<div class="empty">موردی نیست</div>`;
}
function show() { $("#lock").hidden = true; $("#lock").style.display = "none"; $("#app").hidden = false; $("#nav").hidden = false; render(); }

$("#lf").onsubmit = async e => {
  e.preventDefault();
  const pw = $("#pw").value; $("#err").textContent = "در حال باز کردن…";
  try { D = await load(pw); try { sessionStorage.setItem("pw", pw); } catch {} $("#err").textContent = ""; show(); }
  catch (x) { $("#err").textContent = x.message === "net" ? "اتصال برقرار نشد، دوباره امتحان کنید" : "رمز اشتباه است"; }
};
$("#logout").onclick = e => { e.preventDefault(); try { sessionStorage.removeItem("pw"); } catch {} location.reload(); };
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.p));
  scrollTo(0, 0);
});
document.querySelectorAll("#pSeg button").forEach(b => b.onclick = () => {
  pFilter = b.dataset.f; document.querySelectorAll("#pSeg button").forEach(x => x.classList.toggle("on", x === b)); renderParties();
});
$("#pq").oninput = renderParties; $("#sq").oninput = renderStock;
(async () => { let pw = null; try { pw = sessionStorage.getItem("pw"); } catch {} if (pw) { try { D = await load(pw); show(); } catch {} } })();
</script>
</body>
</html>
